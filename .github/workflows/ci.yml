name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Get the PEL study's hash
        id: pel
        run: |
          sha256=$(ibx-pel-track-map-images --print-pel-sha256)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      # The PEL study is about 105 MB, and mta.info may block GitHub's runners,
      # so only download it when the cache doesn't have this version of it.
      - uses: actions/cache@v4
        with:
          path: cache
          key: pel-${{ steps.pel.outputs.sha256 }}

      # Only `main`'s images replace the release's.
      - name: Make the images
        run: ibx-pel-track-map-images ${{ github.ref == 'refs/heads/main' && '--upload' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}

      # So a PR's images can be previewed too.
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: out/
